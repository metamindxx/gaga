<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Store Architecture Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #1a1a2e;
        color: #eee;
        overflow: hidden;
      }
      #app {
        width: 100vw;
        height: 100vh;
      }
      .info-panel {
        position: fixed;
        top: 20px;
        left: 20px;
        background: rgba(0, 0, 0, 0.7);
        padding: 15px 20px;
        border-radius: 8px;
        font-size: 14px;
        max-width: 300px;
        z-index: 100;
      }
      .info-panel h2 {
        margin-bottom: 10px;
        color: #88f;
      }
      .info-panel ul {
        margin-left: 20px;
        line-height: 1.6;
      }
      .info-panel code {
        background: rgba(255, 255, 255, 0.1);
        padding: 2px 6px;
        border-radius: 3px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { runDemo } from "./src/example/storeDemo.js";
      window.demo = runDemo("app");
    </script>
  </body>
</html>
